# mypy policy (2026-10-10). ASCII-ONLY on purpose:
# mypy's configparser reads this file with the locale encoding (GBK on this machine),
# so any non-ASCII comment makes mypy crash with UnicodeDecodeError.
#
# Policy:
#   1) Real defects stay ON - name-defined caught a live NameError regression,
#      arg-type caught over-narrow message-list annotations.
#   2) Only two advisory codes are disabled: var-annotated (empty container needs an
#      annotation) and annotation-unchecked (body lacks annotations) - both are
#      "please annotate" hints, not defects.
#   3) No module-level blanket disabling; third-party SDK signature gaps are handled
#      with a targeted `# type: ignore[...]` plus a reason comment (e.g. ChatOpenAI
#      request_timeout/max_tokens, verified present in model_fields at runtime).
[mypy]
python_version = 3.13
ignore_missing_imports = True
disable_error_code = var-annotated, annotation-unchecked
