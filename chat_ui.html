<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<!-- 本机访问时服务端填入 Windows「鼠标指针大小」（CursorBaseSize），远程访问留空 -->
<meta name="os-cursor-size" content="">
<title>原神剧情助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- 标题衬线字体：fontsource 按 unicode-range 分片，只下载页面实际用到的字；加载失败回退到无衬线 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/chinese-simplified-600.css">
<style>
:root {
  --bg-deep: #0a0e17;
  --bg-surface: #111620;
  --bg-sidebar: #0d1118;
  --bg-input: #141a25;
  --gold: #c9a96e;
  --gold-dim: #a0895a;
  --gold-glow: #e0c886;
  --ice: #7ec8e3;
  --ice-dim: #5a9ab0;
  --text: #d4c5b2;
  --text-dim: #a39581;
  --text-muted: #7d7264;
  --user-bubble: #c9a96e;
  --user-text: #0a0e17;
  --ai-bubble: #1a1f2e;
  --ai-border: #2a3040;
  --border: #232b3a;
  --col: 820px;  /* 对话列最大宽度：宽屏下保持舒适的行长 */
  --red: #e06060;
  --font-display: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', var(--font-body);
  --font-body: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
  --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
/* 全页统一星形指针，--cursor 由 head 里的 applyCursorSize() 按系统指针大小生成；文本输入处保留 I 形光标 */
:root{--cursor:auto}
*,*::before,*::after{cursor:var(--cursor)!important}
textarea,input:not([type=button]):not([type=submit]){cursor:text!important}
body{
  font-family:var(--font-body);
  background:var(--bg-deep);
  color:var(--text);
  height:100vh;overflow:hidden;
  display:flex;
}
/* ---- 星空背景 ---- */
#starfield{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:0;opacity:0.35;
}
/* ---- 侧边栏 ---- */
.sidebar{
  width:260px;min-width:260px;
  background:var(--bg-sidebar);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  z-index:2;position:relative;
  transition:transform 0.3s ease;
}
.sidebar-header{
  padding:20px 16px 12px;
  border-bottom:1px solid var(--border);
  position:relative;
}
/* 会话列表关闭按钮：仅移动端显示（桌面端侧栏常驻，不需要关） */
.sidebar-close{
  display:none;
  position:absolute;top:14px;right:12px;
  width:30px;height:30px;align-items:center;justify-content:center;
  background:none;border:1px solid var(--border);border-radius:6px;
  color:var(--text-dim);font-size:16px;line-height:1;cursor:pointer;
}
.sidebar-close:hover{color:var(--text);border-color:var(--gold)}
/* 移动端侧栏遮罩：点空白处收起抽屉 */
.sidebar-backdrop{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,0.55);
  z-index:9;
  opacity:0;visibility:hidden;
  transition:opacity 0.3s ease,visibility 0.3s ease;
}
.sidebar-backdrop.show{opacity:1;visibility:visible}
.sidebar-header h1{
  font-family:var(--font-display);
  font-size:19px;font-weight:600;color:var(--gold);
  letter-spacing:0.06em;margin-bottom:14px;
  display:flex;align-items:center;gap:6px;
}
.sidebar-header h1::before{
  content:'';display:inline-block;
  width:6px;height:6px;
  background:var(--gold);border-radius:50%;
  box-shadow:0 0 8px var(--gold);
}
.new-chat-btn{
  width:100%;padding:10px 0;border-radius:8px;
  border:1px solid var(--gold-dim);
  background:rgba(201,169,110,0.06);
  color:var(--gold);font-size:14px;cursor:pointer;
  font-family:var(--font-body);
  transition:all 0.2s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.new-chat-btn:hover{
  background:rgba(201,169,110,0.15);
  border-color:var(--gold);
  box-shadow:0 0 16px rgba(201,169,110,0.1);
}
.conversation-list{
  flex:1;overflow-y:auto;padding:8px;
}
.conv-item{
  width:100%;padding:9px 10px 9px 12px;border-radius:6px;
  cursor:pointer;font-size:14px;
  color:var(--text-dim);margin:1px 0;
  transition:all 0.15s;
  display:flex;align-items:center;gap:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:none;border:none;text-align:left;font-family:var(--font-body);
}
.conv-title{flex:1;overflow:hidden;text-overflow:ellipsis}
.conv-group{
  font-size:12px;color:var(--text-muted);
  padding:14px 12px 6px;letter-spacing:0.05em;
}
.conv-group:first-child{padding-top:6px}
.conv-empty{font-size:13px;color:var(--text-muted);padding:16px 12px;text-align:center}
.conv-search{margin:12px 0 0;position:relative}
.conv-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
.conv-search input{
  width:100%;padding:8px 10px 8px 32px;border-radius:6px;
  border:1px solid var(--border);background:var(--bg-input);
  color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;
}
.conv-search input:focus{border-color:var(--gold-dim)}
.conv-search input::placeholder{color:var(--text-muted)}
.conv-item:hover{background:rgba(255,255,255,0.03);color:var(--text)}
.conv-item.active{background:rgba(201,169,110,0.1);color:var(--gold);box-shadow:inset 2px 0 0 var(--gold)}
.conv-item .del-btn{
  margin-left:auto;opacity:0;background:none;border:none;
  color:var(--red);cursor:pointer;font-size:16px;line-height:1;
  padding:2px 6px;border-radius:3px;flex-shrink:0;
  transition:opacity 0.15s;
}
.conv-item:hover .del-btn,.conv-item:focus-within .del-btn,.conv-item.active .del-btn{opacity:0.6}
.conv-item .del-btn:hover{opacity:1;background:rgba(224,96,96,0.15)}
.sidebar-footer{
  padding:10px 12px;border-top:1px solid var(--border);
  font-size:12px;color:var(--text-muted);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.settings-btn{
  display:flex;align-items:center;gap:6px;
  background:none;border:1px solid transparent;border-radius:6px;
  color:var(--text-dim);font-size:13px;font-family:var(--font-body);
  padding:6px 8px;cursor:pointer;transition:all 0.15s;
}
.settings-btn:hover{color:var(--text);border-color:var(--border);background:rgba(255,255,255,0.03)}
.token-badge{
  font-size:11px;padding:1px 6px;border-radius:9px;
  border:1px solid var(--border);color:var(--text-muted);
}
.token-badge.set{border-color:rgba(126,200,227,0.35);color:var(--ice)}
.version{font-size:11px}
/* ---- 主对话区 ---- */
.main{
  flex:1;display:flex;flex-direction:column;
  min-width:0;position:relative;z-index:1;
}
.top-bar{
  padding:14px 24px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
  background:rgba(10,14,23,0.85);backdrop-filter:blur(8px);
  z-index:3;
}
.top-bar h2{
  font-family:var(--font-display);
  font-size:16px;font-weight:600;color:var(--text);
  letter-spacing:0.03em;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.status-pill{
  display:flex;align-items:center;gap:7px;
  padding:4px 10px;border-radius:12px;
  border:1px solid var(--border);background:rgba(255,255,255,0.02);
}
.status-pill.busy{border-color:rgba(126,200,227,0.3)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.status-text{font-size:12px;color:var(--text-dim)}
.status-text.error{color:var(--red)}
/* ---- 对话内容区 ---- */
.chat-area{
  flex:1;overflow-y:auto;padding:24px 24px 32px;
  display:flex;flex-direction:column;gap:6px;
}
/* 消息与欢迎页都收进居中列；滚动条仍贴窗口右侧 */
.chat-area>*{width:100%;max-width:var(--col);margin-left:auto;margin-right:auto}
/* ---- 欢迎页 ---- */
.welcome{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:100%;text-align:center;
  padding-bottom:40px;
}
.welcome-icon{
  color:var(--gold);margin-bottom:18px;
  filter:drop-shadow(0 0 18px rgba(201,169,110,0.45));
}
.welcome-icon svg{display:block}
.welcome h2{
  font-family:var(--font-display);
  font-size:34px;font-weight:600;color:var(--gold);
  letter-spacing:0.08em;margin-bottom:10px;
}
.welcome p{
  color:var(--text-dim);font-size:15px;margin-bottom:36px;letter-spacing:0.04em;
}
.example-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:12px;max-width:640px;width:100%;
}
.example-card{
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:10px;padding:14px 16px;
  cursor:pointer;font-size:14px;color:var(--text);
  text-align:left;transition:all 0.2s;
  line-height:1.5;font-family:var(--font-body);
  display:flex;align-items:center;
}
.example-card:hover{
  border-color:var(--gold-dim);
  background:#151b27;
  box-shadow:0 4px 20px rgba(201,169,110,0.08);
  transform:translateY(-1px);
}
/* ---- 消息气泡 ---- */
.message{
  display:flex;gap:12px;
  animation:msgIn 0.25s ease-out;
  padding:6px 0;
}
.message.user{flex-direction:row-reverse}
.message.user>.msg-col{max-width:80%;align-items:flex-end}
.message.assistant>.msg-col{flex:1}
.msg-col{display:flex;flex-direction:column;min-width:0}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.avatar{
  width:32px;height:32px;border-radius:50%;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:16px;
}
.message.user .avatar{background:rgba(201,169,110,0.15);color:var(--gold)}
.message.assistant .avatar{background:rgba(126,200,227,0.1);color:var(--ice)}
.bubble{
  padding:12px 16px;border-radius:12px;
  font-size:15px;line-height:1.8;
  word-break:break-word;
  user-select:text;-webkit-user-select:text;
}
.message.user .bubble{
  background:var(--user-bubble);color:var(--user-text);
  border-bottom-right-radius:4px;
}
.message.assistant .bubble{
  background:var(--ai-bubble);
  border:1px solid var(--ai-border);
  color:var(--text);
  border-bottom-left-radius:4px;
}
/* ---- Markdown 内部样式 ---- */
.bubble h3{color:var(--gold);font-size:16px;margin:12px 0 6px;font-family:var(--font-display)}
.bubble h4{color:var(--ice);font-size:15px;margin:8px 0 4px}
.bubble p{margin:6px 0}
.bubble ul,.bubble ol{margin:6px 0 6px 20px}
.bubble li{margin:2px 0}
.bubble code{
  background:rgba(0,0,0,0.3);padding:2px 6px;border-radius:3px;
  font-family:var(--font-mono);font-size:13px;
  color:var(--ice);
}
.bubble pre{
  background:rgba(0,0,0,0.4);padding:12px;border-radius:6px;
  overflow-x:auto;margin:8px 0;
  font-family:var(--font-mono);font-size:12px;
}
.bubble pre code{background:none;padding:0}
.bubble strong{color:var(--gold-glow)}
.bubble em{color:var(--ice-dim)}
.bubble table{border-collapse:collapse;margin:8px 0;width:100%;font-size:14px}
.bubble th,.bubble td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.bubble th{background:rgba(201,169,110,0.08);color:var(--gold);font-weight:600}
.bubble blockquote{
  border-left:2px solid var(--gold-dim);padding-left:12px;
  color:var(--text-dim);margin:8px 0;
}
/* ---- 工具调用面板 ---- */
.tool-panel{
  margin-top:4px;border:1px solid var(--border);
  border-radius:8px;overflow:hidden;
  background:var(--bg-surface);
}
.tool-summary{
  padding:8px 12px;cursor:pointer;
  font-size:12px;color:var(--text-dim);
  display:flex;align-items:center;gap:6px;width:100%;
  background:none;border:none;font-family:var(--font-body);text-align:left;
  transition:background 0.15s;
  user-select:none;
}
.tool-summary:hover{background:rgba(255,255,255,0.02)}
.tool-summary .arrow{transition:transform 0.2s;font-size:10px}
.tool-summary.expanded .arrow{transform:rotate(90deg)}
.tool-body{display:none;padding:8px 12px 12px;border-top:1px solid var(--border)}
.tool-body.open{display:block}
.tool-row{padding:6px 8px;font-size:12px;display:flex;gap:8px;align-items:flex-start}
.tool-row:nth-child(odd){background:rgba(0,0,0,0.15);border-radius:4px}
.tool-name{color:var(--gold);font-weight:600;white-space:nowrap;min-width:140px}
.tool-args{color:var(--text-dim);word-break:break-all}
.tool-iter{color:var(--text-muted);font-size:11px;margin-right:6px}
/* ---- 加载动画 ---- */
.typing-indicator{
  display:flex;gap:5px;padding:12px 16px;
  align-items:center;
}
.typing-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--gold-dim);
  animation:typing 1.4s infinite;
}
.typing-dot:nth-child(2){animation-delay:0.2s}
.typing-dot:nth-child(3){animation-delay:0.4s}
@keyframes typing{0%,60%,100%{opacity:0.3;transform:scale(0.8)}30%{opacity:1;transform:scale(1)}}
/* ---- 输入区 ---- */
.input-area{
  padding:12px 24px 16px;
  background:var(--bg-deep);
  z-index:3;
}
.input-inner{max-width:var(--col);margin:0 auto}
.input-row{
  display:flex;gap:8px;align-items:flex-end;
  padding:6px 6px 6px 4px;border-radius:14px;
  border:1px solid var(--border);background:var(--bg-input);
  box-shadow:0 6px 24px rgba(0,0,0,0.35);
  transition:border-color 0.2s,box-shadow 0.2s;
}
.input-row:focus-within{border-color:var(--gold-dim);box-shadow:0 6px 24px rgba(0,0,0,0.35),0 0 0 3px rgba(201,169,110,0.08)}
.input-box{
  flex:1;padding:9px 12px;border-radius:10px;
  border:none;
  background:transparent;color:var(--text);
  font-size:15px;font-family:var(--font-body);
  resize:none;outline:none;line-height:1.5;
  min-height:40px;max-height:200px;
  user-select:text;-webkit-user-select:text;
}
.input-box::placeholder{color:var(--text-muted)}
.send-btn{
  width:40px;height:40px;border-radius:10px;
  border:1px solid var(--gold-dim);
  background:rgba(201,169,110,0.1);
  color:var(--gold);cursor:pointer;
  font-size:18px;display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;flex-shrink:0;
}
.send-btn:hover{
  background:rgba(201,169,110,0.2);
  border-color:var(--gold);
  box-shadow:0 0 12px rgba(201,169,110,0.15);
}
.send-btn:disabled{opacity:0.3;cursor:not-allowed;box-shadow:none}
.input-hint{font-size:12px;color:var(--text-muted);margin-top:8px;text-align:center}
.input-hint kbd{font-family:var(--font-body);font-size:11px;padding:0 5px;border:1px solid var(--border);border-radius:4px;color:var(--text-dim)}
/* ---- 自定义确认弹窗 ---- */
.modal-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.65);z-index:100;
  display:flex;align-items:center;justify-content:center;
  animation:fadeIn 0.2s ease;
}
.modal-box{
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:12px;padding:28px 32px 24px;
  max-width:380px;width:90%;
  box-shadow:0 8px 40px rgba(0,0,0,0.5);
  animation:scaleIn 0.2s ease;
}
.modal-icon{
  font-size:36px;text-align:center;margin-bottom:12px;
  color:var(--red);
}
.modal-title{
  font-family:var(--font-display);
  font-size:16px;color:var(--text);
  text-align:center;margin-bottom:8px;
  letter-spacing:0.03em;
}
.modal-desc{
  font-size:13px;color:var(--text-dim);
  text-align:center;line-height:1.6;margin-bottom:24px;
}
.modal-btns{
  display:flex;gap:10px;justify-content:center;
}
.modal-btn{
  padding:8px 28px;border-radius:8px;
  font-size:13px;cursor:pointer;font-family:var(--font-body);
  transition:all 0.2s;border:none;outline:none;
}
.modal-btn-cancel{
  background:rgba(255,255,255,0.06);color:var(--text-dim);
  border:1px solid var(--border);
}
.modal-btn-cancel:hover{
  background:rgba(255,255,255,0.1);color:var(--text);
}
.modal-btn-danger{
  background:var(--red);color:#fff;
  box-shadow:0 0 12px rgba(224,96,96,0.2);
}
.modal-btn-danger:hover{
  background:#e07070;
  box-shadow:0 0 20px rgba(224,96,96,0.35);
}
.modal-btn-primary{background:var(--gold);color:var(--user-text);font-weight:600}
.modal-btn-primary:hover{background:var(--gold-glow)}
.modal-box.settings{max-width:420px;text-align:left}
.modal-box.settings .modal-title{text-align:left;margin-bottom:16px;font-size:17px}
.field-label{display:block;font-size:13px;color:var(--text);margin-bottom:6px}
.field-help{font-size:12px;color:var(--text-muted);margin-top:6px;line-height:1.6}
.field-input{
  width:100%;padding:9px 12px;border-radius:8px;
  border:1px solid var(--border);background:var(--bg-input);
  color:var(--text);font-size:14px;font-family:var(--font-mono);outline:none;
}
.field-input:focus{border-color:var(--gold-dim)}
.modal-box.settings .modal-btns{justify-content:flex-end;margin-top:22px}
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  background:var(--bg-surface);border:1px solid var(--gold-dim);color:var(--text);
  font-size:13px;padding:8px 16px;border-radius:8px;z-index:200;
  box-shadow:0 6px 24px rgba(0,0,0,0.4);animation:fadeIn 0.2s ease;
}
/* ---- 键盘焦点 ---- */
button:focus-visible,input:focus-visible,.conv-item:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.conv-item:focus-visible{outline-offset:-2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}
/* ---- 滚动条 ---- */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}
/* ---- 响应式 ---- */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;height:100%;transform:translateX(-100%);z-index:10}
  .sidebar.open{transform:translateX(0)}
  /* 抽屉盖住左侧 260px，汉堡按钮在它下面点不到，必须有遮罩与关闭按钮 */
  .sidebar-backdrop{display:block}
  .sidebar-close{display:flex}
  .message.user>.msg-col{max-width:88%}
  .welcome h2{font-size:26px}
  .example-grid{grid-template-columns:1fr}
  .input-area{padding:8px 12px 12px}
  .input-hint{display:none}
  .conv-item .del-btn{opacity:0.6}
  .chat-area{padding:16px}
  .top-bar{padding:12px 16px}
  .hamburger{
    display:flex!important;flex-direction:column;gap:3px;
    cursor:pointer;background:none;border:none;
    padding:4px;
  }
  .hamburger span{
    display:block;width:18px;height:2px;
    background:var(--text-dim);border-radius:1px;
    transition:all 0.2s;
  }
}
@media(min-width:769px){.hamburger{display:none!important}}
</style>
<script>
// ====== 星形鼠标指针 ======
// 图案取自 ys_sc_534517 pointer.cur：原文件是 72px 画布，这里只保留左上 48px 有图的部分。
// Windows 会把整张 72px 画布缩放到「指针大小 × 显示缩放」，所以裁剪后的显示尺寸 = 48/72 × 指针大小（CSS 像素）。

const CURSOR_CROP_RATIO=48/72;
const CURSOR_DEFAULT_BASE=32;   // Windows 默认指针大小（档位 1）
const CURSOR_MAX_CSS=128;       // Chromium 忽略超过 128 CSS 像素的自定义光标

function cursorBaseSize(){
  const saved=Number(localStorage.getItem('cursor_size')||0);
  if(saved)return saved;
  const os=Number(document.querySelector('meta[name="os-cursor-size"]')?.content||0);
  return os||CURSOR_DEFAULT_BASE;
}

function applyCursorSize(){
  const css=Math.min(CURSOR_MAX_CSS,Math.round(cursorBaseSize()*CURSOR_CROP_RATIO));
  const dpr=window.devicePixelRatio||1;
  const px=Math.round(css*dpr);
  const img=new Image();
  img.onload=()=>{
    // 按设备像素重采样一次，避免浏览器在高 DPI 屏上把小图再放大发糊
    const c=document.createElement('canvas');c.width=c.height=px;
    const ctx=c.getContext('2d');ctx.imageSmoothingQuality='high';
    ctx.drawImage(img,0,0,px,px);
    const url=c.toDataURL('image/png');
    // image-set 声明 dpr 倍图，光标的 CSS 尺寸 = px / dpr；热点在左上尖端
    document.documentElement.style.setProperty('--cursor',
      `-webkit-image-set(url("${url}") ${dpr}x) 0 0, url("${url}") 0 0, auto`);
  };
  img.src=CURSOR_SRC;
}
applyCursorSize();
// 拖到不同缩放比例的显示器上时 devicePixelRatio 会变，重新生成
(function watchDpr(){
  matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener('change',()=>{applyCursorSize();watchDpr();},{once:true});

<body>

<script>
// ====== 星空背景 ======
(function(){
  const c=document.getElementById('starfield'),ctx=c.getContext('2d');
  let stars=[],w,h;
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);
  for(let i=0;i<80;i++)stars.push({
    x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.2+0.3,
    a:Math.random()*0.5+0.2,s:Math.random()*0.008+0.003
  });
  function draw(){
    ctx.clearRect(0,0,w,h);
    for(const s of stars){
      s.a+=s.s;if(s.a>0.8||s.a<0.15)s.s*=-1;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(201,169,110,${s.a})`;ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// ====== Markdown 配置（CDN 可能失败，加兜底） ======
let markedAvailable = false;
try {
  if (typeof marked !== 'undefined') {
    marked.setOptions({breaks:true,gfm:true});
    markedAvailable = true;
  }
} catch(e) { console.warn('marked.js 加载失败，将使用纯文本模式'); }

// marked 默认放行原始 HTML，而答案文本来自 LLM/知识库，直接 innerHTML 会执行
// （例如 <img src=x onerror=...>）；这里对渲染结果做白名单清洗。
const ALLOWED_TAGS=new Set(['A','P','BR','HR','STRONG','EM','B','I','DEL','S','CODE','PRE','BLOCKQUOTE','UL','OL','LI','H1','H2','H3','H4','H5','H6','TABLE','THEAD','TBODY','TR','TH','TD','SPAN','DIV','SUP','SUB']);
const DROP_TAGS=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META','BASE','FORM','INPUT','BUTTON','TEXTAREA','SELECT','OPTION','VIDEO','AUDIO','SOURCE','SVG','MATH','TEMPLATE','NOSCRIPT','IMG','HTML','HEAD','BODY']);
const SAFE_ATTRS=new Set(['href','title','align','colspan','rowspan']);
const SAFE_URL_RE=/^(https?:|mailto:|#|\/)/i;

function sanitizeHtml(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  // 只遍历 body 内部：html/head 是 DOMParser 的骨架，替换它们会抛 "Only one element on document allowed"
  doc.body.querySelectorAll('*').forEach(el=>{
    if(DROP_TAGS.has(el.tagName)){el.remove();return;}
    if(!ALLOWED_TAGS.has(el.tagName)){el.replaceWith(...el.childNodes);return;}
    Array.from(el.attributes).forEach(a=>{
      const name=a.name.toLowerCase();
      const value=(a.value||'').trim();
      if(name.startsWith('on')||!SAFE_ATTRS.has(name)||
         ((name==='href'||name==='src')&&!SAFE_URL_RE.test(value))){
        el.removeAttribute(a.name);
      }
    });
    if(el.tagName==='A'){el.setAttribute('target','_blank');el.setAttribute('rel','noopener noreferrer');}
  });
  return doc.body.innerHTML;
}

function renderMarkdown(text) {
  if (markedAvailable) return sanitizeHtml(marked.parse(text));
  // 兜底：纯文本 + 换行转 <br>
  return escHtml(text).replace(/\n/g, '<br>');
}

// ====== 状态 ======
const API_BASE = window.location.origin;
let conversations = [];
let currentConvId = null;
let isStreaming = false;
// 支持 ?k=<访问口令> 直接开链：写入 localStorage 后随请求带 Bearer（演示站用）
const urlK = new URLSearchParams(location.search).get('k');
if (urlK && urlK.trim()) {
  localStorage.setItem('api_token', urlK.trim());
  // 口令已存入 localStorage，立刻从地址栏抹掉：避免它残留在浏览器历史、截图和复制出去的链接里
  history.replaceState(null, '', location.pathname);
}
let apiToken = localStorage.getItem('api_token') || '';

function getAuthHeaders(extra){
  const headers = Object.assign({}, extra || {});
  if(apiToken) headers['Authorization'] = 'Bearer ' + apiToken;
  return headers;
}

function saveApiToken(value){
  apiToken = (value || '').trim();
  localStorage.setItem('api_token', apiToken);
  updateTokenBadge();
  showToast(apiToken ? '访问令牌已保存' : '访问令牌已清除');
  loadSessions();  // 令牌决定会话命名空间，换令牌后刷新列表
}

function updateTokenBadge(){
  const b=document.getElementById('tokenBadge');
  if(!b)return;
  b.textContent=apiToken?'已设令牌':'未设令牌';
  b.classList.toggle('set',!!apiToken);
}

function showToast(text){
  const t=document.createElement('div');
  t.className='toast';t.setAttribute('role','status');t.textContent=text;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),1800);
}

function osCursorLabel(){
  const os=Number(document.querySelector('meta[name="os-cursor-size"]')?.content||0);
  return os?`（当前 ${os}px）`:'（未检测到，按默认）';
}

function openSettings(){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=`
    <div class="modal-box settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-title" id="settingsTitle">设置</div>
      <label class="field-label" for="apiTokenInput">访问令牌</label>
      <input class="field-input" id="apiTokenInput" type="password" autocomplete="off" placeholder="本机直连可留空">
      <div class="field-help">通过远程地址访问时填写。令牌只保存在本浏览器，并决定你能看到哪些历史对话。</div>
      <label class="field-label" for="cursorSizeSelect" style="margin-top:18px">鼠标指针大小</label>
      <select class="field-input" id="cursorSizeSelect" style="font-family:var(--font-body)">
        <option value="0">跟随系统${osCursorLabel()}</option>
        <option value="32">1 档（默认）</option>
        <option value="48">2 档</option>
        <option value="64">3 档</option>
        <option value="96">5 档</option>
        <option value="128">7 档</option>
      </select>
      <div class="field-help">档位对应 Windows「设置 → 辅助功能 → 鼠标指针和触控 → 大小」。远程访问时读不到系统设置，可在这里手动选。</div>
      <div class="modal-btns">
        <button class="modal-btn modal-btn-cancel">取消</button>
        <button class="modal-btn modal-btn-primary">保存</button>
      </div>
    </div>`;
  const input=overlay.querySelector('#apiTokenInput');
  input.value=apiToken;
  const sizeSel=overlay.querySelector('#cursorSizeSelect');
  const savedSize=localStorage.getItem('cursor_size')||'0';
  sizeSel.value=sizeSel.querySelector(`option[value="${savedSize}"]`)?savedSize:'0';
  // 选中即预览，取消时还原
  sizeSel.onchange=()=>{localStorage.setItem('cursor_size',sizeSel.value);applyCursorSize();};
  const close=()=>overlay.remove();
  const cancel=()=>{localStorage.setItem('cursor_size',savedSize);applyCursorSize();close();};
  const save=()=>{
    if(sizeSel.value==='0')localStorage.removeItem('cursor_size');
    if(input.value.trim()!==apiToken)saveApiToken(input.value);
    close();
  };
  overlay.querySelector('.modal-btn-cancel').onclick=cancel;
  overlay.querySelector('.modal-btn-primary').onclick=save;
  overlay.addEventListener('click',e=>{if(e.target===overlay)cancel();});
  overlay.addEventListener('keydown',e=>{
    if(e.key==='Escape')cancel();
    else if(e.key==='Enter'&&e.target===input)save();
  });
  document.body.appendChild(overlay);
  input.focus();
}

// 会话 ID 由时间戳 + 随机串组成：时间戳可猜，光靠它别人能凭 /api/sessions/<id> 读删同一个会话
function generateConvId(){
  const buf=crypto.getRandomValues(new Uint8Array(8));
  return 'conv_'+Date.now()+'_'+Array.from(buf,b=>b.toString(16).padStart(2,'0')).join('');
}

// ====== 对话管理 ======
async function loadSessions(){
  try{
    const resp=await fetch(API_BASE+'/api/sessions',{headers:getAuthHeaders()});
    const data=await resp.json();
    if(data.sessions&&data.sessions.length>0){
      // id 会被拼进 onclick 的 JS 字符串，只接受服务端约定的字符集
      conversations=data.sessions.filter(s=>/^[A-Za-z0-9_-]{1,64}$/.test(s.id||'')).map(s=>({
        id:s.id,title:s.title,messages:[],loaded:false
      }));
    }else{
      conversations=conversations.filter(c=>c.loaded&&c.messages.length===0);
    }
    renderSidebar();
  }catch(e){
    console.error('加载会话列表失败:',e);
  }
}

function newChat(){
  closeSidebar();
  currentConvId = generateConvId();
  conversations.push({id:currentConvId,title:'新对话',messages:[],loaded:true});
  showWelcome();
  document.getElementById('convTitle').textContent='新对话';
  renderSidebar();
}

// 会话 ID 形如 conv_<毫秒时间戳>_<随机串>，用它推出创建时间做分组，无需后端额外字段
function convTime(c){
  const m=/^conv_(\d{13})/.exec(c.id);
  return m?Number(m[1]):0;
}

function convGroup(ts){
  if(!ts)return '更早';
  const day=86400000;
  const today=new Date();today.setHours(0,0,0,0);
  const t=today.getTime();
  if(ts>=t)return '今天';
  if(ts>=t-day)return '昨天';
  if(ts>=t-7*day)return '近 7 天';
  if(ts>=t-30*day)return '近 30 天';
  return '更早';
}

function convDisplayTitle(c){
  if(c.title==='新对话'&&c.messages.length>0){
    const t=c.messages[0].text.replace(/\n/g,' ');
    return t.slice(0,20)+(t.length>20?'…':'');
  }
  return c.title||'新对话';
}

function renderSidebar(){
  const list=document.getElementById('convList');
  const q=(document.getElementById('convSearch')?.value||'').trim().toLowerCase();
  const items=conversations
    .map(c=>({c,title:convDisplayTitle(c),ts:convTime(c)}))
    .filter(x=>!q||x.title.toLowerCase().includes(q))
    .sort((a,b)=>b.ts-a.ts);
  if(items.length===0){
    list.innerHTML=`<div class="conv-empty">${q?'没有匹配的对话':'还没有对话'}</div>`;
    return;
  }
  let html='',lastGroup='';
  for(const {c,title,ts} of items){
    const g=convGroup(ts);
    if(g!==lastGroup){html+=`<div class="conv-group">${g}</div>`;lastGroup=g;}
    const active=c.id===currentConvId;
    html+=`<div class="conv-item${active?' active':''}" role="button" tabindex="0"${active?' aria-current="true"':''}
      onclick="switchConv('${c.id}')" onkeydown="if(event.target===this&&(event.key==='Enter'||event.key===' ')){event.preventDefault();switchConv('${c.id}')}">
      <span class="conv-title" title="${escHtml(title).replace(/"/g,'&quot;')}">${escHtml(title)}</span>
      <button class="del-btn" onclick="event.stopPropagation();deleteConv('${c.id}')" title="删除" aria-label="删除对话">×</button>
    </div>`;
  }
  list.innerHTML=html;
}

function switchConv(id){
  currentConvId=id;
  closeSidebar();  // 移动端点完会话就收起抽屉
  const conv=conversations.find(c=>c.id===id);
  if(!conv)return;
  document.getElementById('convTitle').textContent=conv.title;
  const area=document.getElementById('chatArea');

  if(conv.loaded){
    // 已加载过，直接渲染
    if(conv.messages.length===0){
      showWelcome();
      renderSidebar();
      return;
    }
    area.innerHTML=conv.messages.map((m,i)=>renderMessage(m,i)).join('');
    scrollBottom();
    renderSidebar();
    bindToolPanels();
    return;
  }

  // 未加载，从服务器拉取会话详情
  const welcome=document.getElementById('welcome');
  if(welcome)welcome.style.display='none';
  area.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-dim)">加载中...</div>';
  fetch(API_BASE+'/api/sessions/'+encodeURIComponent(id),{headers:getAuthHeaders()})
    .then(r=>r.json())
    .then(data=>{
      const pairs=data.pairs||[];
      conv.messages=[];
      for(const pair of pairs){
        conv.messages.push({role:'user',text:pair.user,timestamp:0});
        conv.messages.push({role:'assistant',text:pair.assistant,timestamp:0});
      }
      conv.loaded=true;
      if(conv.messages.length===0){
        showWelcome();
        renderSidebar();
        return;
      }
      area.innerHTML=conv.messages.map((m,i)=>renderMessage(m,i)).join('');
      scrollBottom();
      renderSidebar();
      bindToolPanels();
    })
    .catch(e=>{
      console.error('加载会话详情失败:',e);
      area.innerHTML='<div style="text-align:center;padding:40px;color:var(--red)">加载失败</div>';
    });
}

];

      '<path d="M32 4 C34 22 42 30 60 32 C42 34 34 42 32 60 C30 42 22 34 4 32 C22 30 30 22 32 4Z" fill="currentColor"/>'+
      '<circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"/>'+
      '<circle cx="32" cy="32" r="28" fill="none" stroke="currentColor" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="2 4"/>'+
    '</svg></div>'+

function deleteConv(id){
  showConfirm('删除对话', '确定要删除这个对话吗？删除后无法恢复。', ()=>{
    const idx=conversations.findIndex(c=>c.id===id);
    if(idx===-1)return;
    conversations.splice(idx,1);
    if(currentConvId===id){
      if(conversations.length>0){switchConv(conversations[conversations.length-1].id)}
      else{newChat()}
    }else{renderSidebar()}
    fetch(API_BASE+'/api/sessions/'+encodeURIComponent(id),{method:'DELETE',headers:getAuthHeaders()})
      .catch(e=>console.error('删除会话文件失败:',e));
  });
}

// ====== 自定义确认弹窗 ======
function showConfirm(title, message, onConfirm){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=`
    <div class="modal-box">
      <div class="modal-icon">&#x26A0;</div>
      <div class="modal-title">${escapeHtml(title)}</div>
      <div class="modal-desc">${escapeHtml(message)}</div>
      <div class="modal-btns">
        <button class="modal-btn modal-btn-cancel">取消</button>
        <button class="modal-btn modal-btn-danger">确认删除</button>
      </div>
    </div>
  `;
  overlay.querySelector('.modal-btn-cancel').onclick=()=>overlay.remove();
  overlay.querySelector('.modal-btn-danger').onclick=()=>{overlay.remove();onConfirm();};
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.body.appendChild(overlay);
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ====== 消息渲染 ======
function renderMessage(m,idx){
  const role=m.role;
  const avatar=role==='user'?('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>'):('<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="5"/><path d="M3 21c0-5 4-9 9-9s9 4 9 9"/></svg>');
  let toolHtml='';
  if(m.tool_calls&&m.tool_calls.length>0){
    const total=m.tool_calls.length;
    toolHtml=`<div class="tool-panel">
      <button class="tool-summary" onclick="toggleTools(this)" aria-expanded="false">
        <span class="arrow" aria-hidden="true">▶</span> 工具调用（${total} 次）
      </button>
      <div class="tool-body">${m.tool_calls.map((tc,i)=>
        `<div class="tool-row"><span class="tool-iter">#${i+1}</span><span class="tool-name">${escHtml(tc.tool)}</span><span class="tool-args">${escHtml(tc.args||'')}</span></div>`
      ).join('')}</div>
    </div>`;
  }
  const bubbleContent=role==='assistant'?renderMarkdown(m.text):escHtml(m.text);
  return `<div class="message ${role}">
    <div class="avatar">${avatar}</div>
    <div class="msg-col">
      <div class="bubble">${bubbleContent}</div>
      ${toolHtml}
    </div>
  </div>`;
}

function bindToolPanels(){
  document.querySelectorAll('.tool-summary').forEach(el=>{
    el.onclick=function(){toggleTools(this)};
  });
}

function toggleTools(el){
  const open=el.classList.toggle('expanded');
  el.setAttribute('aria-expanded',String(open));
  const body=el.nextElementSibling;
  if(body)body.classList.toggle('open');
}

// ====== 发送消息 ======
function handleSendBtn(){
  if(isStreaming){
    stopGeneration();
  }else{
    sendMessage();
  }
}

async function stopGeneration(){
  try{
    await fetch(API_BASE+'/api/cancel',{
      method:'POST',
      headers:getAuthHeaders({'Content-Type':'application/json'}),
      body:JSON.stringify({session_id:currentConvId})
    });
  }catch(e){
    console.error('取消请求失败:',e);
  }
}

function askExample(el){
  document.getElementById('inputBox').value=el.textContent.trim();
  sendMessage();
}

async function sendMessage(){
  if(isStreaming)return;
  const input=document.getElementById('inputBox');
  const text=input.value.trim();
  if(!text)return;

  // 如果没有当前对话，自动新建
  if(!currentConvId||!conversations.find(c=>c.id===currentConvId)){
    currentConvId=generateConvId();
    conversations.push({id:currentConvId,title:text.slice(0,30),messages:[]});
  }

  const sendingConvId=currentConvId;  // 锁定发送时的会话，防止流式返回时用户切换到其他会话导致消息错位
  const conv=conversations.find(c=>c.id===sendingConvId);
  if(!conv)return;
  conv.title=text.slice(0,30);

  // 隐藏欢迎页
  const welcome=document.getElementById('welcome');
  if(welcome)welcome.style.display='none';

  // 添加用户消息
  const userMsg={role:'user',text:text,timestamp:Date.now()};
  conv.messages.push(userMsg);
  appendMessage(userMsg,conv.messages.length-1);

  input.value='';
  input.style.height='auto';
  isStreaming=true;
  setLoading(true);
  document.getElementById('convTitle').textContent=conv.title;
  renderSidebar();

  // 添加进度指示器（会动态更新文字）
  const progressEl=document.createElement('div');
  progressEl.className='message assistant';
  progressEl.id='progressMsg';
  progressEl.innerHTML=`<div class="avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="5"/><path d="M3 21c0-5 4-9 9-9s9 4 9 9"/></svg></div><div class="msg-col"><div class="bubble" id="progressBubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div><div style="margin-top:6px;font-size:13px;color:var(--text-dim)" id="progressText">正在思考…</div></div></div>`;
  document.getElementById('chatArea').appendChild(progressEl);
  scrollBottom();

  // 工具名称 → 中文提示
  const TOOL_HINT={
    'hybrid_search':'检索知识库',
    'query_character':'查询角色',
    'query_region':'查询地区',
    'load_quest_content':'加载任务文本',
    'load_book_content':'加载书籍内容',
    'find_first_mention':'溯源首次出现',
    'query_collectible':'查询采集物',
    'list_characters_by_element':'列出元素角色',
    'list_characters_by_region':'列出地区角色',
    'list_characters_by_weapon':'列出武器角色',
    'list_characters_by_rarity':'列出售星角色',
    'list_collectibles_by_region':'列出地区特产',
    'query_material':'查询材料',
    'query_quest':'查询任务',
    'search_all':'搜索全库',
    'query_artifact':'查询圣遗物',
    'query_monster':'查询怪物',
    'query_weapon':'查询武器',
    'query_recipe':'查询食谱',
    'get_book_metadata':'获取书籍信息',
  };

  let toolCount = 0;

  try{
    const resp=await fetch(API_BASE+'/api/chat',{
      method:'POST',
      headers:getAuthHeaders({'Content-Type':'application/json'}),
      body:JSON.stringify({message:text,session_id:currentConvId})
    });

    const reader=resp.body.getReader();
    const decoder=new TextDecoder();
    let buffer='';
    let aiText='';
    let streamRaw='';
    let finalToolCalls=[];

    while(true){
      const{value,done}=await reader.read();
      if(done)break;
      buffer+=decoder.decode(value,{stream:true});

      // 解析 SSE 事件
      const lines=buffer.split('\n');
      buffer=lines.pop()||'';
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        try{
          const event=JSON.parse(line.slice(6));
          if(event.type==='tool_start'){
            toolCount++;
            const hint=TOOL_HINT[event.tool]||('调用 '+event.tool);
            const arg=typeof event.args==='object'?Object.values(event.args)[0]||'':(event.args||'');
            const shortArg=String(arg).slice(0,20);
            document.getElementById('progressText').textContent=
              '正在'+hint+(shortArg?'（'+shortArg+')':'')+'… (第'+toolCount+'次)';
          }else if(event.type==='tool_end'){
            // 工具完成，不更新文字
          }else if(event.type==='answer_start'){
            // 进入回答阶段，更新进度文字但不移除
            const pt=document.getElementById('progressText');
            if(pt)pt.textContent='正在组织语言…';
          }else if(event.type==='answer_delta'){
            // 流式回答：把增量追加到进度气泡中
            const pb=document.getElementById('progressBubble');
            if(pb){
              let st=document.getElementById('streamText');
              if(!st){
                st=document.createElement('div');
                st.id='streamText';
                st.style.marginTop='6px';
                st.style.fontSize='15px';
                st.style.lineHeight='1.8';
                pb.appendChild(st);
                const pt=document.getElementById('progressText');
                if(pt)pt.remove();
              }
              streamRaw += (event.delta||'');
              st.innerHTML=renderMarkdown(streamRaw);
              scrollBottom();
            }
          }else if(event.type==='done'){
            aiText=event.answer||'';
            finalToolCalls=event.tool_calls||[];

            if(!aiText && !document.getElementById('progressMsg')){
              // answer_start 没触发但 progress 已经被移除了
            }
          }else if(event.type==='error'){
            document.getElementById('progressText').textContent='错误：'+event.error;
          }else if(event.type==='cancelled'){
            // 用户中断，标记不保存此轮对话
            window._cancelled=true;
          }
        }catch(e){/* 忽略解析失败的行 */}
      }
    }

    // 确保进度指示器被移除（仅当用户仍在发送会话时操作 DOM）
    if(currentConvId===sendingConvId){
      const p=document.getElementById('progressMsg');
      if(p)p.remove();
    }

    // 添加 AI 回答（中断时不保存）
    if(!window._cancelled){
      const aiMsg={
        role:'assistant',
        text:aiText||'（无回复）',
        timestamp:Date.now(),
        tool_calls:finalToolCalls
      };
      conv.messages.push(aiMsg);
      // 仅在用户仍在发送会话时才追加到当前 DOM
      if(currentConvId===sendingConvId){
        appendMessage(aiMsg,conv.messages.length-1);
      }
    }
    window._cancelled=false;

  }catch(e){
    if(currentConvId===sendingConvId){
      const p=document.getElementById('progressMsg');
      if(p)p.remove();
    }
    const errMsg={role:'assistant',text:'无法连接到本地服务，请确认已启动后端。',timestamp:Date.now()};
    conv.messages.push(errMsg);
    if(currentConvId===sendingConvId){
      appendMessage(errMsg,conv.messages.length-1);
    }
  }
  setLoading(false);
  renderSidebar();
}

function appendMessage(m,idx){
  const area=document.getElementById('chatArea');
  area.insertAdjacentHTML('beforeend',renderMessage(m,idx));
  scrollBottom();
  bindToolPanels();
}

function setLoading(loading){
  isStreaming=loading;
  const btn=document.getElementById('sendBtn');
  const sendIcon=document.getElementById('sendIcon');
  const stopIcon=document.getElementById('stopIcon');
  const dot=document.getElementById('statusDot');
  const txt=document.getElementById('statusText');
  if(loading){
    btn.title='中断';
    sendIcon.style.display='none';
    stopIcon.style.display='';
    dot.style.background='var(--ice)';
    dot.style.boxShadow='0 0 8px var(--ice)';
    document.getElementById('statusPill').classList.add('busy');
    txt.textContent='思考中…';
    txt.className='status-text';
  }else{
    btn.title='发送';
    sendIcon.style.display='';
    stopIcon.style.display='none';
    btn.disabled=false;
    dot.style.background='var(--gold)';
    dot.style.boxShadow='0 0 8px var(--gold)';
    document.getElementById('statusPill').classList.remove('busy');
    txt.textContent='就绪';
    txt.className='status-text';
  }
}

function autoGrow(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,200)+'px';
}

function handleKey(e){
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();handleSendBtn()}
}

function scrollBottom(){
  const area=document.getElementById('chatArea');
  setTimeout(()=>{area.scrollTop=area.scrollHeight},50);
}

function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarBackdrop').classList.add('show');
}

function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
}

function toggleSidebar(){
  // 桌面端侧栏常驻（不会带 open），只有移动端抽屉才有开/关两态
  if(document.getElementById('sidebar').classList.contains('open')){closeSidebar()}else{openSidebar()}
}

// 移动端横屏/窗口变宽回到桌面布局时收起抽屉，避免留下点不掉的灰层
window.addEventListener('resize',()=>{if(window.innerWidth>768)closeSidebar()});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeSidebar()});

// 页面关闭时自动取消正在运行的 Agent
window.addEventListener('beforeunload',()=>{
  if(isStreaming && currentConvId){
    fetch(API_BASE+'/api/cancel',{
      method:'POST',
      headers:getAuthHeaders({'Content-Type':'application/json'}),
      body:JSON.stringify({session_id:currentConvId}),
      keepalive:true
    }).catch(()=>{});
  }
});

function escHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ====== 初始化 ======
updateTokenBadge();
showWelcome();
renderSidebar();
loadSessions();
</script>
