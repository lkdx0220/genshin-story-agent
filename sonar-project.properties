# SonarCloud 配置（与 agent-trace-inspector 保持同一套范式）。
#
# 首次使用（需要仓库所有者操作）：
#   1. 用 GitHub 登录 https://sonarcloud.io，导入 lkdx0220/genshin-story-agent；
#   2. 生成 SONAR_TOKEN，加到 GitHub 仓库 Secrets（Settings → Secrets and variables → Actions）；
#   3. 把 .github/workflows/sonar.yml 里的 workflow_dispatch 换成 push/pull_request（见该文件注释）；
#   4. 若 SonarCloud 组织 key 不是 lkdx0220，改下面的 sonar.organization；
#   5. **质量门要自定义**：本仓库没有单元测试（测试在独立的 agent-trace-inspector 仓库里，
#      通过 --workspace 指向本仓库运行），默认「Sonar way」要求新代码覆盖率 ≥80% 会永远红。
#      请在 Organization → Quality Gates 复制一个自定义门，去掉覆盖率条件。
sonar.projectKey=lkdx0220_genshin-story-agent
sonar.organization=lkdx0220

sonar.projectName=genshin-story-agent
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# 运行时 Python 代码 + Web 服务 + 知识库模块。
sonar.sources=app,genshin_knowledge_base,character_aliases.py,genshin_story_agent.py,genshin_story_web_api.py,intent_router.py,kb_vector_store.py,memory_manager.py,wiki_entry_graph.py,wiki_graph_channels.py,launcher.py

# 构建期/抓取脚本暂不纳入门禁（长期无人维护的独立脚本，噪声大于收益）：
#   scripts/、wiki_data_tools/ 单独看，别让它们的存量问题淹没有价值的信号。
# 数据与产物目录本来就在 .gitignore 里，这里再兜一层，防止将来被 Track 后误入分析。
sonar.exclusions=\
  scripts/**,\
  wiki_data_tools/**,\
  **/__pycache__/**,\
  kb_vectors/**,\
  kb_vectors_m3/**,\
  content_data/**,\
  conversation_memory/**,\
  reports/**,\
  build/**,\
  dist/**,\
  release_assets*/**,\
  _trash_*/**,\
  .venv/**

# 重复代码排除：提示词/数据表这类天然重复的文本不参与 CPD。
sonar.cpd.exclusions=\
  content_data/**,\
  prompts/**

# 没有仓库内单测，覆盖率一律不采集（质量门里也要去掉覆盖率条件）。
sonar.python.coverage.reportPaths=
